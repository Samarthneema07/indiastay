<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IndiaStay — Admin Control Center</title><link rel="stylesheet" href="admin.css"></head>
<body>
<div id="login" class="login-wrap"><div class="login-card"><div class="brand">India<span>Stay</span> <b>ADMIN</b></div><h1>Control Center</h1><p>Sign in with a staff account.</p>
<form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button><p id="loginErr" class="err"></p></form></div></div>
<div id="app" class="hidden"><aside><div class="brand">India<span>Stay</span><b>ADMIN</b></div><div id="me"></div><nav>
<button data-tab="dashboard">Overview</button><button data-tab="bookings">Bookings</button><button data-tab="hotels">Hotels & rooms</button><button data-tab="reviews">Reviews</button><button data-tab="staff" id="staffNav">Staff & users</button><button data-tab="audit" id="auditNav">Audit log</button>
</nav><button id="logout" class="logout">Log out</button></aside>
<main><header><div><small>INDIASTAY OPERATIONS</small><h1 id="title">Overview</h1></div><span id="roleBadge"></span></header>
<section id="dashboard" class="tab"></section><section id="bookings" class="tab hidden"></section><section id="hotels" class="tab hidden"></section><section id="reviews" class="tab hidden"></section><section id="staff" class="tab hidden"></section><section id="audit" class="tab hidden"></section>
</main></div><script src="admin.js"></script></body></html>
